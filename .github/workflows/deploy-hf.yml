name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install requests huggingface_hub --quiet
          python3 << 'PYEOF'
          import requests, json, os
          from huggingface_hub import create_repo
          
          token = os.environ["HF_TOKEN"]
          
          # 方法1: 用 huggingface_hub create_repo
          print("创建 Space: alongy7/octuplex-backend")
          try:
              url = create_repo(
                  repo_id="alongy7/octuplex-backend",
                  repo_type="space",
                  space_sdk="docker",
                  token=token,
                  exist_ok=True
              )
              print(f"✅ Space 已就绪: {url}")
          except Exception as e:
              print(f"create_repo 异常: {e}")
              # 方法2: 用 REST API
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              r = requests.post(
                  "https://huggingface.co/api/repos/create",
                  headers=headers,
                  json={
                      "name": "octuplex-backend",
                      "type": "space",
                      "sdk": "docker",
                      "private": False
                  }
              )
              print(f"REST API HTTP {r.status_code}: {r.text[:200]}")
              if r.status_code == 200:
                  print("✅ Space 已创建！")
          PYEOF

      - name: Upload Files to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import os
          
          token = os.environ["HF_TOKEN"]
          api = HfApi()
          
          print("上传文件到 Space...")
          api.upload_folder(
              folder_path=".",
              repo_id="alongy7/octuplex-backend",
              repo_type="space",
              token=token
          )
          print("✅ 文件上传完成！")
          PYEOF

      - name: Set Space Variables
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os
          
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          
          variables = {
              "CORS_ORIGINS": "https://alongy7.github.io",
              "SERVER_PORT": "7860",
              "SERVER_HOST": "0.0.0.0",
          }
          
          for key, value in variables.items():
              r = requests.post(
                  "https://huggingface.co/api/repos/alongy7/octuplex-backend/secrets",
                  headers=headers,
                  json={"key": key, "value": value}
              )
              print(f"Set {key}: HTTP {r.status_code}")
          
          print("✅ 环境变量配置完成！")
          PYEOF