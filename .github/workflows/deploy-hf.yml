name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create HF Space (Gradio SDK)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install requests --quiet
          python3 << 'PYEOF'
          import requests, os
          
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          
          # 用 Gradio SDK + ZeroGPU（免费）创建 Space
          print("创建 Space: alongy7/octuplex-backend (Gradio + ZeroGPU)")
          r = requests.post(
              "https://huggingface.co/api/repos/create",
              headers=headers,
              json={
                  "name": "octuplex-backend",
                  "type": "space",
                  "sdk": "gradio",
                  "hardware": "zero-a10g",
                  "private": False
              }
          )
          print(f"HTTP {r.status_code}: {r.text[:300]}")
          
          if r.status_code in (200, 201):
              print("✅ Space 已创建！")
          elif r.status_code == 409:
              print("✅ Space 已存在！")
          else:
              print(f"❌ 创建失败: {r.text}")
              exit(1)
          PYEOF

      - name: Configure Space Hardware (ZeroGPU)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os
          
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          
          # 设置硬件为 ZeroGPU
          print("配置 Space 硬件: zero-a10g (ZeroGPU)")
          r = requests.post(
              "https://huggingface.co/api/spaces/alongy7/octuplex-backend/hardware",
              headers=headers,
              json={"hardware": "zero-a10g"}
          )
          print(f"硬件配置: HTTP {r.status_code} - {r.text[:200]}")
          
          # 设置运行时
          r2 = requests.post(
              "https://huggingface.co/api/spaces/alongy7/octuplex-backend/runtime",
              headers=headers,
              json={"runtime": "gradio"}
          )
          print(f"运行时配置: HTTP {r2.status_code} - {r2.text[:200]}")
          print("✅ Space 配置完成！")
          PYEOF

      - name: Upload Files to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import os
          
          token = os.environ["HF_TOKEN"]
          api = HfApi()
          
          print("上传文件到 Space...")
          api.upload_folder(
              folder_path=".",
              repo_id="alongy7/octuplex-backend",
              repo_type="space",
              token=token
          )
          print("✅ 文件上传完成！")
          PYEOF

      - name: Set Space Variables
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os
          
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          
          variables = {
              "CORS_ORIGINS": "https://alongy7.github.io",
              "SERVER_PORT": "7860",
              "SERVER_HOST": "0.0.0.0",
          }
          
          for key, value in variables.items():
              r = requests.post(
                  "https://huggingface.co/api/spaces/alongy7/octuplex-backend/secrets",
                  headers=headers,
                  json={"key": key, "value": value}
              )
              print(f"Set {key}: HTTP {r.status_code}")
          
          print("✅ 环境变量配置完成！")
          PYEOF