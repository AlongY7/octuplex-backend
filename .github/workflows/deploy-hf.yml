name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python3 << 'PYEOF'
          from huggingface_hub import HfApi, create_repo
          api = HfApi()
          try:
              create_repo("alongy7/octuplex-backend", repo_type="space", space_sdk="gradio", exist_ok=True)
              print("✅ Space ready")
          except Exception as e:
              print(f"⚠️  {e}")
          PYEOF

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/alongy7/octuplex-backend
          git push hf main --force 2>&1