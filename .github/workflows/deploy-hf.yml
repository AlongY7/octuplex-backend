name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install requests --quiet
          python3 << 'PYEOF'
          import requests, json, os
          
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          
          # 用 REST API 创建 Space
          print("通过 REST API 创建 Space...")
          data = {
              "name": "octuplex-backend",
              "sdk": "docker",
              "hardware": "cpu-basic",
              "private": False,
              "secrets": {}
          }
          
          r = requests.post(
              "https://huggingface.co/api/spaces",
              headers=headers,
              json=data
          )
          
          print(f"HTTP {r.status_code}: {r.text[:300]}")
          if r.status_code in (200, 201, 409):
              print("✅ Space 已就绪！")
          else:
              print(f"⚠️ 响应: {r.text}")
          PYEOF

      - name: Upload Files to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub --quiet
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import os
          
          token = os.environ["HF_TOKEN"]
          api = HfApi()
          
          print("上传文件到 Space...")
          api.upload_folder(
              folder_path=".",
              repo_id="alongy7/octuplex-backend",
              repo_type="space",
              token=token
          )
          print("✅ 文件上传完成！")
          PYEOF

      - name: Set Space Variables
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os
          
          token = os.environ["HF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          
          # 设置 Space 环境变量
          variables = {
              "CORS_ORIGINS": "https://alongy7.github.io",
              "SERVER_PORT": "7860",
              "SERVER_HOST": "0.0.0.0",
          }
          
          for key, value in variables.items():
              r = requests.post(
                  f"https://huggingface.co/api/spaces/alongy7/octuplex-backend/secrets",
                  headers=headers,
                  json={"key": key, "value": value}
              )
              print(f"Set {key}: HTTP {r.status_code}")
          
          print("✅ 环境变量配置完成！")
          PYEOF