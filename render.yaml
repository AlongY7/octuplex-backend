# ============================================================
# Render Blueprint 配置文件
# Docker 部署（避免原生 Python 环境内存不足）
# ============================================================

services:
  - type: web
    name: octuplex-backend
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: "https://alongy7.github.io"
      - key: ENABLE_GRADIO
        value: "false"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL_NAME
        sync: false
      - key: SANDBOX_WORK_DIR
        value: "/tmp/sandbox_workspace"
      - key: LOG_DIR
        value: "/tmp/logs"
      - key: CHROMA_PERSIST_DIR
        value: "/tmp/chroma_db"