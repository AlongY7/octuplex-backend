# ============================================================
# Octuplex 日志轮转配置
# 使用Python logging.handlers.RotatingFileHandler
# 无需额外配置文件，此文件仅作为配置说明参考
# ============================================================

# 日志配置已集成在 app.py 中，通过 .env 控制：
#   LOG_LEVEL=INFO          # 日志级别: DEBUG/INFO/WARNING/ERROR
#   LOG_DIR=./logs          # 日志存储目录
#   LOG_MAX_SIZE_MB=100     # 单个日志文件最大大小(MB)
#   LOG_BACKUP_COUNT=7      # 保留的备份日志文件数量

# 日志文件命名规则：
#   octuplex.log            # 当前日志文件
#   octuplex.log.1          # 最近轮转的备份
#   octuplex.log.2          # 次近轮转的备份
#   ...以此类推...

# 日志内容格式：
#   [2026-08-05 14:30:00,123] [INFO] [Octuplex] module_name - message content